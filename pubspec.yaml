name: phantasm_read
description: Cross-platform Flutter comic and novel reader package.
version: 0.0.7
homepage: https://github.com/whevether/phantasm_read
license: MIT

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  extended_image: 10.1.0
  webview_flutter: 4.14.1
  screen_brightness: 2.1.11
  wakelock_plus: 1.8.1
  charset_converter: 2.5.1
  shared_preferences: 2.5.6
  archive: 4.4.0
  http: 1.6.0
  path_provider: ^2.1.6
  audioplayers: 6.8.1
  pdf: 3.13.1
  printing: 5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  assets:
    - assets/epubjs/
