<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPUB Reader</title>
    <style>
      html,
      body,
      #viewer {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #fff;
      }
    </style>
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
  </head>
  <body>
    <div id="viewer"></div>
    <script>
      "use strict";
      let uploadParts = [];
      let direction = null;
      function decodeBase64(base64) {
        const binary = atob(base64),
          bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
      let book = null,
        rendition = null,
        toc = [],
        flat = [],
        flatSection = [],
        boundCache = new Map(),
        fontFaces = new Map(),
        relocSeq = 0,
        flow = "paginated",
        lastCfi = null;
      let trialStart = null,
        trialCount = null,
        startBoundary = null,
        endBoundary = null,
        opening = 0;
      const cfiUtil = () => new ePub.CFI();
      function post(type, payload) {
        if (window.EpubChannel)
          window.EpubChannel.postMessage(JSON.stringify({ type, payload }));
      }
      function flatten(items) {
        return (items || []).flatMap((i) => [i, ...flatten(i.subitems)]);
      }
      function simplify(items) {
        return (items || []).map((i) => ({
          label: i.label || "",
          href: i.href || "",
          children: simplify(i.subitems),
        }));
      }
      function sectionFor(target) {
        try {
          return book.spine.get(target);
        } catch (_) {
          return null;
        }
      }
      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (_) {
          return value;
        }
      }
      // Resolves a TOC item to a section boundary. Returns null (never throws
      // for a missing section/anchor) so callers can decide fail-open/closed.
      async function boundary(item, useHash = true) {
        if (!item) return null;
        const section = sectionFor(item.href);
        if (!section) return null;
        try {
          await section.load(book.load.bind(book));
          const raw = item.href.split("#")[1];
          const hash = useHash && raw ? safeDecode(raw) : null;
          const element = hash
            ? section.document.getElementById(hash)
            : section.document.body;
          if (!element) return null;
          return {
            index: section.index,
            hash,
            cfi: section.cfiFromElement(element),
            href: item.href,
          };
        } finally {
          section.unload();
        }
      }
      async function boundaryAt(i, useHash = true) {
        const key = i + (useHash ? "#" : "");
        if (!boundCache.has(key))
          boundCache.set(
            key,
            await boundary(flat[i], useHash).catch(() => null),
          );
        return boundCache.get(key);
      }
      function sectionIndexOf(cfi) {
        try {
          const section = book.spine.get(cfi);
          return section ? section.index : 0;
        } catch (_) {
          return 0;
        }
      }
      // "../Text/c2.xhtml#a" relative to the current section -> spine href.
      function resolveHref(baseHref, href) {
        const u = new URL(
          href,
          "http://epub.invalid/" + String(baseHref).replace(/^\/+/, ""),
        );
        return safeDecode(u.pathname.replace(/^\//, "")) + u.hash;
      }
      function sanitizeFamily(family) {
        return String(family || "")
          .replace(/[\x00-\x1f\x7f"'\\<>{}();]/g, "")
          .trim();
      }
      const GENERIC_FAMILIES = [
        "serif",
        "sans-serif",
        "monospace",
        "cursive",
        "fantasy",
        "system-ui",
        "initial",
      ];
      function cssFamily(family) {
        const name = sanitizeFamily(family);
        if (!name) return "initial";
        return GENERIC_FAMILIES.includes(name) ? name : '"' + name + '"';
      }
      function applyFonts(contents) {
        if (!fontFaces.size) return;
        const css = Array.from(fontFaces.values()).join("\n");
        for (const c of contents ||
          (rendition ? rendition.getContents() : []))
          c.addStylesheetCss(css, "phantasm-fonts");
      }
      function compare(a, b) {
        return cfiUtil().compare(a, b);
      }
      function allowed(cfi) {
        return (
          (!startBoundary || compare(cfi, startBoundary.cfi) >= 0) &&
          (!endBoundary || compare(cfi, endBoundary.cfi) < 0)
        );
      }
      function readableSection(index) {
        return (
          (!startBoundary || index >= startBoundary.index) &&
          (!endBoundary || index <= endBoundary.index)
        );
      }
      function trimAt(node, before) {
        // Preserve element positions in the DOM so original CFIs stay valid.
        while (node && node.parentNode && node !== node.ownerDocument.body) {
          let sibling = before ? node.previousSibling : node.nextSibling;
          while (sibling) {
            if (sibling.nodeType === 1)
              sibling.style.setProperty("display", "none", "important");
            else if (sibling.nodeType === 3) sibling.textContent = "";
            sibling = before ? sibling.previousSibling : sibling.nextSibling;
          }
          node = node.parentNode;
        }
      }
      function clipContent(contents) {
        const doc = contents.document,
          index = contents.sectionIndex;
        if (!readableSection(index)) {
          doc.body.style.display = "none";
          return;
        }
        if (
          startBoundary &&
          index === startBoundary.index &&
          startBoundary.hash
        ) {
          const n = doc.getElementById(startBoundary.hash);
          if (n) trimAt(n, true);
        }
        if (endBoundary && index === endBoundary.index) {
          if (!endBoundary.hash) {
            doc.body.style.display = "none";
            return;
          }
          const n = doc.getElementById(endBoundary.hash);
          if (n) {
            trimAt(n, false);
            n.style.setProperty("display", "none", "important");
          }
        }
      }
      // Chapter index for [cfi]. Only sections that share the spine item are
      // resolved exactly, so no full-book scan is needed on open.
      async function chapterAt(cfi) {
        const idx = sectionIndexOf(cfi);
        let hit = 0;
        for (let i = 0; i < flat.length; i++) {
          const s = flatSection[i];
          if (s < 0 || s > idx) continue;
          if (s < idx) {
            hit = i;
            continue;
          }
          const b = await boundaryAt(i);
          if (b && compare(cfi, b.cfi) >= 0) hit = i;
        }
        return hit;
      }
      function wireContents(contents) {
        clipContent(contents);
        const doc = contents.document;
        let base = 0,
          font = 100;
        doc.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length === 2) {
              base = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY,
              );
              font = fontSize;
            }
          },
          { passive: true },
        );
        doc.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length !== 2 || !base) return;
            const d = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY,
            );
            fontSize = Math.min(200, Math.max(66.667, (font * d) / base));
            rendition.themes.fontSize(fontSize + "%");
            post("fontSizeChanged", { percent: fontSize });
            e.preventDefault();
          },
          { passive: false },
        );
        doc.addEventListener("click", (e) => {
          const a = e.target.closest && e.target.closest("a[href]");
          if (!a) return;
          e.preventDefault();
          const href = a.getAttribute("href");
          if (!href || /^(?:[a-z][a-z0-9+.-]*:)/i.test(href)) return;
          let target = href;
          try {
            const current = book.spine.get(contents.sectionIndex);
            if (current) target = resolveHref(current.href, href);
          } catch (_) {
            /* Fall back to the raw href. */
          }
          bridge
            .display(target)
            .catch((error) => post("warning", { message: String(error) }));
        });
      }
      let fontSize = 100;
      async function makeRendition(target) {
        if (rendition) rendition.destroy();
        document.getElementById("viewer").innerHTML = "";
        rendition = book.renderTo("viewer", {
          width: "100%",
          height: "100%",
          flow,
          manager: flow === "scrolled" ? "continuous" : "default",
          allowScriptedContent: false,
          allowPopups: false,
        });
        if (direction) rendition.direction(direction);
        rendition.hooks.content.register(wireContents);
        rendition.hooks.content.register((contents) => applyFonts([contents]));
        rendition.on("relocated", async (location) => {
          const start = location && location.start;
          if (!start) return;
          if (!allowed(start.cfi)) {
            const next =
              !!endBoundary && compare(start.cfi, endBoundary.cfi) >= 0;
            post("trialBoundary", { next });
            rendition
              .display(lastCfi || (startBoundary && startBoundary.href))
              .catch((error) => post("warning", { message: String(error) }));
            return;
          }
          lastCfi = start.cfi;
          const seq = ++relocSeq;
          const chapterIndex = await chapterAt(start.cfi);
          if (seq !== relocSeq) return;
          const total = book.spine.length || 1;
          post("locationChanged", {
            cfi: start.cfi,
            chapterIndex,
            percentage:
              typeof start.percentage === "number"
                ? start.percentage
                : (start.index +
                    (start.displayed.page - 1) /
                      Math.max(1, start.displayed.total)) /
                  total,
          });
        });
        await rendition.display(
          target || (startBoundary && startBoundary.href) || undefined,
        );
      }
      const bridge = {
        request(id, method, args) {
          Promise.resolve()
            .then(() => {
              if (method === "request" || typeof bridge[method] !== "function")
                throw new Error("Unknown bridge method");
              return bridge[method](...args);
            })
            .then(
              (result) =>
                post("response", {
                  id,
                  result: result === undefined ? null : result,
                }),
              (error) =>
                post("response", {
                  id,
                  error: String((error && error.message) || error),
                }),
            );
        },
        beginUpload() {
          uploadParts = [];
        },
        appendChunk(base64) {
          if (!/^[A-Za-z0-9+/]*={0,2}$/.test(String(base64)))
            throw new Error("Invalid EPUB chunk");
          uploadParts.push(decodeBase64(base64));
        },
        async openFromBase64(base64, newFlow, start, count, initialCfi) {
          const version = ++opening;
          flow = newFlow || "paginated";
          trialStart = start;
          trialCount = count;
          if (rendition) {
            rendition.destroy();
            rendition = null;
          }
          if (book) book.destroy();
          lastCfi = null;
          let bytes;
          if (base64 == null) {
            // Chunked upload (beginUpload/appendChunk): avoids one huge string.
            let total = 0;
            for (const part of uploadParts) total += part.length;
            bytes = new Uint8Array(total);
            let at = 0;
            for (const part of uploadParts) {
              bytes.set(part, at);
              at += part.length;
            }
            uploadParts = [];
          } else {
            bytes = decodeBase64(base64);
          }
          book = ePub(bytes.buffer);
          await book.ready;
          const nav = await book.loaded.navigation;
          if (version !== opening) return;
          toc = nav.toc || [];
          flat = flatten(toc);
          flatSection = flat.map((item) => {
            const section = sectionFor(item.href);
            return section ? section.index : -1;
          });
          boundCache = new Map();
          startBoundary = null;
          endBoundary = null;
          // Boundaries are resolved only for the trial window edges, and fail
          // closed: when an edge cannot be resolved we never expose more.
          if (count != null && count > 0) {
            if (!flat.length || start < 0 || start >= flat.length)
              throw new Error("No readable chapters in trial window");
            for (let i = start; i < flat.length && !startBoundary; i++)
              startBoundary = await boundaryAt(i);
            if (!startBoundary)
              throw new Error("Cannot resolve the trial start chapter");
            const endIndex = start + count;
            if (endIndex < flat.length) {
              for (let i = endIndex; i < flat.length && !endBoundary; i++)
                endBoundary =
                  (await boundaryAt(i)) || (await boundaryAt(i, false));
              if (!endBoundary)
                throw new Error("Cannot resolve the trial end chapter");
              if (compare(startBoundary.cfi, endBoundary.cfi) >= 0)
                throw new Error("No readable chapters in trial window");
            }
            if (version !== opening) return;
          }
          const target = initialCfi && allowed(initialCfi) ? initialCfi : null;
          await makeRendition(target);
          return true;
        },
        async next() {
          if (rendition) await rendition.next();
        },
        async prev() {
          if (rendition) await rendition.prev();
        },
        async display(target) {
          if (!rendition) return;
          if (target && target.startsWith("epubcfi(")) {
            if (!allowed(target)) {
              post("trialBoundary", {
                next: !!endBoundary && compare(target, endBoundary.cfi) >= 0,
              });
              return;
            }
          } else if (target && (startBoundary || endBoundary)) {
            const b =
              (await boundary({ href: target })) ||
              (await boundary({ href: target }, false));
            if (!b) {
              // Not a spine document (dead link): not a trial boundary.
              post("warning", { message: "Unresolved link: " + target });
              return;
            }
            if (!allowed(b.cfi)) {
              post("trialBoundary", {
                next: !!endBoundary && compare(b.cfi, endBoundary.cfi) >= 0,
              });
              return;
            }
          }
          await rendition.display(target || undefined);
        },
        getToc() {
          return simplify(toc);
        },
        getLocation() {
          const loc = rendition && rendition.currentLocation();
          return loc && loc.start
            ? { cfi: loc.start.cfi, percentage: loc.start.percentage }
            : null;
        },
        setDirection(value) {
          direction = value === "rtl" ? "rtl" : null;
          if (rendition && direction) rendition.direction(direction);
        },
        async setFlow(value) {
          flow = value === "scrolled" ? "scrolled" : "paginated";
          if (book) await makeRendition(lastCfi);
        },
        async search(query) {
          if (!book || !query) return [];
          const hits = [];
          for (const section of book.spine.spineItems) {
            if (!readableSection(section.index)) continue;
            try {
              await section.load(book.load.bind(book));
              for (const result of section.find(query)) {
                if (allowed(result.cfi))
                  hits.push({ cfi: result.cfi, excerpt: result.excerpt });
                if (hits.length >= 50) break;
              }
            } finally {
              section.unload();
            }
            if (hits.length >= 50) break;
          }
          return hits;
        },
        getLanguage() {
          const meta = book && book.packaging && book.packaging.metadata;
          return (meta && meta.language) || null;
        },
        getText() {
          return rendition
            ? rendition
                .getContents()
                .filter(
                  (c) =>
                    c.document.defaultView.getComputedStyle(c.document.body)
                      .display !== "none",
                )
                .map((c) => c.document.body.innerText)
                .join("\n")
            : "";
        },
        setFontSize(percent) {
          fontSize = percent;
          if (rendition) rendition.themes.fontSize(percent + "%");
        },
        addFontFace(family, base64, mime) {
          const name = sanitizeFamily(family);
          if (!name) throw new Error("Invalid font family");
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(String(base64)))
            throw new Error("Invalid font data");
          const type = /^font\/(?:ttf|otf|woff2?)$/.test(String(mime))
            ? mime
            : "font/ttf";
          fontFaces.set(
            name,
            '@font-face{font-family:"' +
              name +
              '";src:url(data:' +
              type +
              ";base64," +
              base64 +
              ");}",
          );
          applyFonts();
        },
        setFontFamily(family) {
          if (rendition) rendition.themes.font(cssFamily(family));
        },
        setLineHeight(value) {
          if (rendition)
            rendition.themes.override("line-height", String(value));
        },
        setTypography(spacing, margin, align) {
          if (rendition) {
            rendition.themes.override("letter-spacing", spacing + "px");
            rendition.themes.override("padding", margin + "px");
            rendition.themes.override("text-align", align);
            rendition.themes.override("box-sizing", "border-box");
          }
        },
        setTheme(bg, fg) {
          document.body.style.background = bg;
          if (rendition) {
            rendition.themes.override("background", bg);
            rendition.themes.override("color", fg);
          }
        },
        close() {
          opening++;
          if (rendition) rendition.destroy();
          if (book) book.destroy();
          rendition = null;
          book = null;
        },
      };
      window.epubBridge = bridge;
      post("shellReady", {});
    </script>
  </body>
</html>
