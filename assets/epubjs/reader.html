<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>EPUB Reader</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #viewer { width: 100%; height: 100%; }
    #viewer .epub-container { width: 100% !important; height: 100% !important; }
  </style>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <script>
    let book = null;
    let rendition = null;
    let currentFlow = 'paginated';

    function post(type, payload) {
      try {
        if (window.EpubChannel && window.EpubChannel.postMessage) {
          window.EpubChannel.postMessage(JSON.stringify({ type: type, payload: payload || null }));
        }
      } catch (e) {}
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function simplifyToc(items) {
      return (items || []).map(function (item) {
        return {
          label: item.label || '',
          href: item.href || '',
          children: simplifyToc(item.subitems || [])
        };
      });
    }

    function bindRelocated() {
      if (!rendition) return;
      rendition.on('relocated', function (location) {
        const cfi = location && location.start ? location.start.cfi : null;
        const percentage = (location && location.start && location.start.percentage != null)
          ? location.start.percentage
          : null;
        post('locationChanged', { cfi: cfi, percentage: percentage });
      });
    }

    async function ensureRendition() {
      if (!book) throw new Error('book not opened');
      if (!rendition) {
        const opts = {
          width: '100%',
          height: '100%',
          flow: currentFlow || 'paginated',
          allowScriptedContent: true
        };
        if (currentFlow === 'scrolled') {
          opts.manager = 'continuous';
        }
        rendition = book.renderTo('viewer', opts);
        bindRelocated();
      }
      return rendition;
    }

    async function recreateRendition(keepCfi) {
      let cfi = keepCfi || null;
      if (!cfi && rendition) {
        try {
          const loc = rendition.currentLocation();
          if (loc && loc.start) cfi = loc.start.cfi;
        } catch (e) {}
      }
      if (rendition) {
        try { rendition.destroy(); } catch (e) {}
        rendition = null;
        const el = document.getElementById('viewer');
        if (el) el.innerHTML = '';
      }
      await ensureRendition();
      await rendition.display(cfi || undefined);
    }

    window.epubBridge = {
      async openFromBase64(base64, flow) {
        try {
          if (flow) currentFlow = flow;
          if (book) { try { book.destroy(); } catch (e) {} }
          book = ePub(base64ToArrayBuffer(base64));
          rendition = null;
          const el = document.getElementById('viewer');
          if (el) el.innerHTML = '';
          await ensureRendition();
          await rendition.display();
          post('ready', { ok: true });
          return true;
        } catch (e) {
          post('error', { message: String(e && e.message ? e.message : e) });
          throw e;
        }
      },
      async next() {
        if (!rendition) return;
        await rendition.next();
      },
      async prev() {
        if (!rendition) return;
        await rendition.prev();
      },
      async display(target) {
        if (!rendition) return;
        await rendition.display(target || undefined);
      },
      async getToc() {
        if (!book) return '[]';
        const nav = await book.loaded.navigation;
        return JSON.stringify(simplifyToc(nav && nav.toc ? nav.toc : []));
      },
      async getLocation() {
        if (!rendition) return null;
        const loc = rendition.currentLocation();
        if (!loc || !loc.start) return null;
        return { cfi: loc.start.cfi, percentage: loc.start.percentage };
      },
      async setFlow(flow) {
        currentFlow = flow === 'scrolled' ? 'scrolled' : 'paginated';
        if (!book) return;
        await recreateRendition();
      },
      async search(query) {
    if (!book || !query) return '[]';
    try {
      const results = await book.search(query);
      const mapped = (results || []).slice(0, 50).map(function (r) {
        return {
          cfi: r.cfi || (r.excerpt && r.excerpt.cfi) || '',
          excerpt: (r.excerpt && (r.excerpt.cfirange || r.excerpt.excerpt || r.excerpt)) || String(r)
        };
      });
      return JSON.stringify(mapped);
    } catch (e) {
      return '[]';
    }
  },
  setFontSize(percent) {
        if (!rendition) return;
        rendition.themes.fontSize(String(percent) + '%');
      },
      setFontFamily(family) {
        if (!rendition || !family) return;
        rendition.themes.font(family);
      },
      setLineHeight(value) {
        if (!rendition) return;
        rendition.themes.default({ body: { 'line-height': String(value) } });
      },
      setTheme(bg, fg) {
        if (!rendition) return;
        document.body.style.background = bg || '#ffffff';
        rendition.themes.default({
          body: { background: bg || '#ffffff', color: fg || '#000000' }
        });
      }
    };

    post('shellReady', {});
  </script>
</body>
</html>
