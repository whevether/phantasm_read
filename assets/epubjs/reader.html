<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPUB Reader</title>
    <style>
      html,
      body,
      #viewer {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #fff;
      }
    </style>
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
  </head>
  <body>
    <div id="viewer"></div>
    <script>
      "use strict";
      let book = null,
        rendition = null,
        toc = [],
        flat = [],
        flatBounds = [],
        flow = "paginated",
        lastCfi = null;
      let trialStart = null,
        trialCount = null,
        startBoundary = null,
        endBoundary = null,
        opening = 0;
      const cfiUtil = () => new ePub.CFI();
      function post(type, payload) {
        if (window.EpubChannel)
          window.EpubChannel.postMessage(JSON.stringify({ type, payload }));
      }
      function flatten(items) {
        return (items || []).flatMap((i) => [i, ...flatten(i.subitems)]);
      }
      function simplify(items) {
        return (items || []).map((i) => ({
          label: i.label || "",
          href: i.href || "",
          children: simplify(i.subitems),
        }));
      }
      function sectionFor(target) {
        try {
          return book.spine.get(target);
        } catch (_) {
          return null;
        }
      }
      async function boundary(item) {
        if (!item) return null;
        const section = sectionFor(item.href);
        if (!section) return null;
        await section.load(book.load.bind(book));
        const hash = item.href.split("#")[1];
        const element = hash
          ? section.document.getElementById(decodeURIComponent(hash))
          : section.document.body;
        if (!element) throw new Error("Unresolved chapter anchor");
        const result = {
          index: section.index,
          hash: hash ? decodeURIComponent(hash) : null,
          cfi: section.cfiFromElement(element),
          href: item.href,
        };
        section.unload();
        return result;
      }
      function compare(a, b) {
        return cfiUtil().compare(a, b);
      }
      function allowed(cfi) {
        return (
          (!startBoundary || compare(cfi, startBoundary.cfi) >= 0) &&
          (!endBoundary || compare(cfi, endBoundary.cfi) < 0)
        );
      }
      function readableSection(index) {
        return (
          (!startBoundary || index >= startBoundary.index) &&
          (!endBoundary || index <= endBoundary.index)
        );
      }
      function trimAt(node, before) {
        // Preserve element positions in the DOM so original CFIs stay valid.
        while (node && node.parentNode && node !== node.ownerDocument.body) {
          let sibling = before ? node.previousSibling : node.nextSibling;
          while (sibling) {
            if (sibling.nodeType === 1)
              sibling.style.setProperty("display", "none", "important");
            else if (sibling.nodeType === 3) sibling.textContent = "";
            sibling = before ? sibling.previousSibling : sibling.nextSibling;
          }
          node = node.parentNode;
        }
      }
      function clipContent(contents) {
        const doc = contents.document,
          index = contents.sectionIndex;
        if (!readableSection(index)) {
          doc.body.style.display = "none";
          return;
        }
        if (
          startBoundary &&
          index === startBoundary.index &&
          startBoundary.hash
        ) {
          const n = doc.getElementById(startBoundary.hash);
          if (n) trimAt(n, true);
        }
        if (endBoundary && index === endBoundary.index) {
          if (!endBoundary.hash) {
            doc.body.style.display = "none";
            return;
          }
          const n = doc.getElementById(endBoundary.hash);
          if (n) {
            trimAt(n, false);
            n.style.setProperty("display", "none", "important");
          }
        }
      }
      function chapterAt(cfi) {
        let hit = 0;
        for (let i = 0; i < flatBounds.length; i++)
          if (flatBounds[i] && compare(cfi, flatBounds[i].cfi) >= 0) hit = i;
        return hit;
      }
      function wireContents(contents) {
        clipContent(contents);
        const doc = contents.document;
        let base = 0,
          font = 100;
        doc.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length === 2) {
              base = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY,
              );
              font = fontSize;
            }
          },
          { passive: true },
        );
        doc.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length !== 2 || !base) return;
            const d = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY,
            );
            fontSize = Math.min(200, Math.max(66.667, (font * d) / base));
            rendition.themes.fontSize(fontSize + "%");
            post("fontSizeChanged", { percent: fontSize });
            e.preventDefault();
          },
          { passive: false },
        );
        doc.addEventListener("click", (e) => {
          const a = e.target.closest && e.target.closest("a[href]");
          if (!a) return;
          e.preventDefault();
          const href = a.getAttribute("href");
          if (/^(?:https?:|mailto:|javascript:|data:)/i.test(href)) return;
          bridge
            .display(
              href.startsWith("#") ? book.spine.get(index).href + href : href,
            )
            .catch((error) => post("error", { message: String(error) }));
        });
      }
      let fontSize = 100;
      async function makeRendition(target) {
        if (rendition) rendition.destroy();
        document.getElementById("viewer").innerHTML = "";
        rendition = book.renderTo("viewer", {
          width: "100%",
          height: "100%",
          flow,
          manager: flow === "scrolled" ? "continuous" : "default",
          allowScriptedContent: false,
          allowPopups: false,
        });
        rendition.hooks.content.register(wireContents);
        rendition.on("relocated", (location) => {
          const start = location && location.start;
          if (!start) return;
          if (!allowed(start.cfi)) {
            const next =
              !!endBoundary && compare(start.cfi, endBoundary.cfi) >= 0;
            post("trialBoundary", { next });
            rendition
              .display(lastCfi || (startBoundary && startBoundary.href))
              .catch((error) => post("error", { message: String(error) }));
            return;
          }
          lastCfi = start.cfi;
          const total = book.spine.length || 1;
          post("locationChanged", {
            cfi: start.cfi,
            chapterIndex: chapterAt(start.cfi),
            percentage:
              typeof start.percentage === "number"
                ? start.percentage
                : (start.index +
                    (start.displayed.page - 1) /
                      Math.max(1, start.displayed.total)) /
                  total,
          });
        });
        await rendition.display(
          target || (startBoundary && startBoundary.href) || undefined,
        );
      }
      const bridge = {
        request(id, method, args) {
          Promise.resolve()
            .then(() => {
              if (method === "request" || typeof bridge[method] !== "function")
                throw new Error("Unknown bridge method");
              return bridge[method](...args);
            })
            .then(
              (result) =>
                post("response", {
                  id,
                  result: result === undefined ? null : result,
                }),
              (error) =>
                post("response", {
                  id,
                  error: String((error && error.message) || error),
                }),
            );
        },
        async openFromBase64(base64, newFlow, start, count, initialCfi) {
          const version = ++opening;
          flow = newFlow || "paginated";
          trialStart = start;
          trialCount = count;
          if (rendition) {
            rendition.destroy();
            rendition = null;
          }
          if (book) book.destroy();
          lastCfi = null;
          const binary = atob(base64),
            bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++)
            bytes[i] = binary.charCodeAt(i);
          book = ePub(bytes.buffer);
          await book.ready;
          const nav = await book.loaded.navigation;
          if (version !== opening) return;
          toc = nav.toc || [];
          flat = flatten(toc);
          flatBounds = [];
          for (const item of flat) flatBounds.push(await boundary(item));
          startBoundary = null;
          endBoundary = null;
          if (count != null && count > 0) {
            if (!flat.length || start < 0 || start >= flat.length)
              throw new Error("No readable chapters in trial window");
            startBoundary = flatBounds[start];
            endBoundary = flatBounds[start + count] || null;
          }
          const target = initialCfi && allowed(initialCfi) ? initialCfi : null;
          await makeRendition(target);
          return true;
        },
        async next() {
          if (rendition) await rendition.next();
        },
        async prev() {
          if (rendition) await rendition.prev();
        },
        async display(target) {
          if (!rendition) return;
          if (target && target.startsWith("epubcfi(")) {
            if (!allowed(target)) {
              post("trialBoundary", {
                next: !!endBoundary && compare(target, endBoundary.cfi) >= 0,
              });
              return;
            }
          } else if (target) {
            const b = await boundary({ href: target });
            if (!b || !allowed(b.cfi)) {
              post("trialBoundary", {
                next:
                  !b || (!!endBoundary && compare(b.cfi, endBoundary.cfi) >= 0),
              });
              return;
            }
          }
          await rendition.display(target || undefined);
        },
        getToc() {
          return simplify(toc);
        },
        getLocation() {
          const loc = rendition && rendition.currentLocation();
          return loc && loc.start
            ? { cfi: loc.start.cfi, percentage: loc.start.percentage }
            : null;
        },
        async setFlow(value) {
          flow = value === "scrolled" ? "scrolled" : "paginated";
          if (book) await makeRendition(lastCfi);
        },
        async search(query) {
          if (!book || !query) return [];
          const hits = [];
          for (const section of book.spine.spineItems) {
            if (!readableSection(section.index)) continue;
            try {
              await section.load(book.load.bind(book));
              for (const result of section.find(query)) {
                if (allowed(result.cfi))
                  hits.push({ cfi: result.cfi, excerpt: result.excerpt });
                if (hits.length >= 50) break;
              }
            } finally {
              section.unload();
            }
            if (hits.length >= 50) break;
          }
          return hits;
        },
        getText() {
          return rendition
            ? rendition
                .getContents()
                .filter(
                  (c) =>
                    c.document.defaultView.getComputedStyle(c.document.body)
                      .display !== "none",
                )
                .map((c) => c.document.body.innerText)
                .join("\n")
            : "";
        },
        setFontSize(percent) {
          fontSize = percent;
          if (rendition) rendition.themes.fontSize(percent + "%");
        },
        setFontFamily(family) {
          if (rendition) rendition.themes.font(family || "initial");
        },
        setLineHeight(value) {
          if (rendition)
            rendition.themes.override("line-height", String(value));
        },
        setTypography(spacing, margin, align) {
          if (rendition) {
            rendition.themes.override("letter-spacing", spacing + "px");
            rendition.themes.override("padding", margin + "px");
            rendition.themes.override("text-align", align);
            rendition.themes.override("box-sizing", "border-box");
          }
        },
        setTheme(bg, fg) {
          document.body.style.background = bg;
          if (rendition) {
            rendition.themes.override("background", bg);
            rendition.themes.override("color", fg);
          }
        },
        close() {
          opening++;
          if (rendition) rendition.destroy();
          if (book) book.destroy();
          rendition = null;
          book = null;
        },
      };
      window.epubBridge = bridge;
      post("shellReady", {});
    </script>
  </body>
</html>
